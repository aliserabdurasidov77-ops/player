</div></div>
<script>
const $=s=>document.querySelector(s),A=new Audio(),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={play:'M8 5v14l11-7z',pause:'M7 5h4v14H7zM13 5h4v14h-4z',next:'M4 5v14l10-7zM16 5h3v14h-3z',prev:'M20 5v14L10 12zM5 5h3v14H5z',vol:'M3 9v6h4l5 4V5L7 9z',
shuf:'M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5',rep:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
heart:'M12 21s-7.500-4.600-9.600-9.200C1 8.600 3 5 6.400 5c2 0 3.600 1.100 5.600 3.300C14 6.100 15.600 5 17.600 5 21 5 23 8.600 21.600 11.800 19.500 16.400 12 21 12 21z',
search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',note:'M9 18V5l12-2v13M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
plus:'M12 5v14M5 12h14',queue:'M3 6h14M3 12h14M3 18h8M17 15l4 3-4 3z',down:'M6 9l6 6 6-6'};
const ST=new Set(['shuf','rep','heart','search','note','plus','queue','down']);
P.star='M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.8 6.4 20l1.3-6.2L3 9.5l6.3-.7z';P.more='M5 12h.01M12 12h.01M19 12h.01';P.lyr='M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z';P.cast='M2 16a5 5 0 0 1 5 5M2 12a9 9 0 0 1 9 9M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6';P.rw='M11 6v12L2 12zM22 6v12l-9-6z';P.ff='M13 6v12l9-6zM2 6v12l9-6z';['star','more','lyr','cast'].forEach(k=>ST.add(k));
Object.assign(P,{home:'M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',lib:'M4 8h16M6 4h12M4 12h16v8H4z',back:'M15 5l-7 7 7 7',folder:'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'});['home','grid','lib','back','folder'].forEach(k=>ST.add(k));
const ic=(n,s=24,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" ${ST.has(n)?`fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`:'fill="currentColor"'}><path d="${P[n]}"/></svg>`;
const fm=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
let PL=[],plId=null,plDel=false,DIR=null,T=[],Q=[],Q0=[],qi=-1,view='home',sh=false,rp=0,delId=null,url=null,showQ=false,drag=false,VL=[];
const cur=()=>T.find(t=>t.id===Q[qi]);

/* --- хранилище (IndexedDB, работает офлайн) --- */
const db=new Promise((r,j)=>{try{const q=indexedDB.open('mp',1);q.onupgradeneeded=()=>q.result.createObjectStore('t',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j()}catch(e){j()}});
const tx=(m,f)=>db.then(d=>new Promise((r,j)=>{const t=d.transaction('t',m),q=f(t.objectStore('t'));t.oncomplete=()=>r(q&&q.result);t.onerror=j})).catch(()=>[]);
const put=t=>{const{au,col,...o}=t;return tx('readwrite',s=>s.put(o))};

/* --- ID3 теги --- */
function dec(d){const e=d[0];let b=d.subarray(1),l=e==0?'windows-1251':e==3?'utf-8':e==2?'utf-16be':'utf-16le';if(e==1){if(b[0]==254&&b[1]==255){l='utf-16be';b=b.subarray(2)}else if(b[0]==255&&b[1]==254)b=b.subarray(2)}return new TextDecoder(l).decode(b).replace(/\0/g,'').trim()}
async function id3(f){const o={};try{const h=new Uint8Array(await f.slice(0,10).arrayBuffer());if(String.fromCharCode(h[0],h[1],h[2])!=='ID3'||h[3]<3)return o;const v=h[3],sz=((h[6]&127)<<21)|((h[7]&127)<<14)|((h[8]&127)<<7)|(h[9]&127);const b=new Uint8Array(await f.slice(10,10+Math.min(sz,12e6)).arrayBuffer());let p=0;
while(p+10<b.length){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;const s=v==4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):new DataView(b.buffer,b.byteOffset+p+4,4).getUint32(0);const d=b.subarray(p+10,p+10+s);p+=10+s;
if(id=='TIT2')o.title=dec(d);else if(id=='TPE1')o.artist=dec(d);else if(id=='TALB')o.album=dec(d);
else if(id=='APIC'&&!o.art){const e=d[0];let i=1;while(d[i])i++;let m=String.fromCharCode(...d.subarray(1,i));i+=2;if(e==1||e==2){while(!(d[i]==0&&d[i+1]==0)&&i<d.length)i+=2;i+=2}else{while(d[i])i++;i++}if(!/^image\//.test(m))m='image/jpeg';o.art=new Blob([d.slice(i)],{type:m})}}}catch(e){}return o}
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{r(a.duration);URL.revokeObjectURL(u)};a.onerror=()=>r(0);a.src=u;setTimeout(()=>r(0),4000)});
async function add(fs){for(const f of fs){if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|flac|wav|ogg|aac|opus)$/i.test(f.name))continue;const k=f.name+'|'+f.size;if(T.some(t=>t.src==k))continue;const m=/mp3|mpeg/i.test(f.type+f.name)?await id3(f):{};
const t={added:Date.now(),src:k,id:Date.now()+'-'+Math.random().toString(36).slice(2),title:m.title||f.name.replace(/\.[^.]+$/,''),artist:m.artist||'Неизвестный исполнитель',album:m.album||'',blob:f,art:m.art||null,dur:await dur(f),fav:false};
if(t.art)t.au=URL.createObjectURL(t.art);T.push(t);put(t);draw()}}

/* --- интерфейс --- */
const art=(t,c='')=>`<div class="art ${c}">${t&&t.au?`<img src="${t.au}" alt="">`:ic('note',22)}</div>`;
const lib=()=>[...T].sort((a,b)=>a.title.localeCompare(b.title,'ru'));
const PLY=(()=>{try{return JSON.parse(localStorage.getItem('ply')||'{}')}catch(e){return{}}})();
let SEC=+(localStorage.getItem('sec')||0),pt=0,tk=0,H=[],C=null,tab='songs',srch='',fresh=true;
const hs=id=>[...String(id)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7),byH=a=>[...a].sort((x,y)=>hs(x.id)-hs(y.id));
const hm=s=>{const m=Math.round(s/60),h=Math.floor(m/60);return h?h+' ч '+m%60+' мин':m+' мин'};
const rowH=t=>`<div class="row${cur()?.id===t.id?' on':''}" data-id="${t.id}">${art(t)}<div class="tx"><div class="t1">${E(t.title)}</div><div class="t2">${E(t.artist)}</div></div><span class="t2">${fm(t.dur)}</span><button class="more" data-id="${t.id}">⋮</button></div>`;
const cd=(t,s)=>`<div class="cd" data-id="${t.id}" data-al="${E(t.album||'')}">${art(t)}<div class="t1">${E(t.title)}</div><div class="t2">${E(s||t.artist)}</div></div>`;
const big=t=>`<div class="bg" data-id="${t.id}" data-al="" style="background-image:${t.au?`linear-gradient(transparent 45%,rgba(0,0,0,.78)),url(${t.au})`:'linear-gradient(160deg,#7b3fa0,#2a1a5e)'}"><div class="t2">Для вас</div><div class="t1">${E(t.title)}</div><div class="t2">${E(t.artist)}</div></div>`;
const sec=(h,b)=>b?`<h3>${h}</h3>${b}`:'';
const emp=()=>`<div class="empty"><b>Добавьте музыку</b>Файлы хранятся на устройстве, плеер работает без интернета.<br><button class="wb" data-a="add">Добавить музыку</button></div>`;
const plc=p=>{const ok=p.ids.map(i=>T.find(y=>y.id==i)).filter(Boolean);return{ok,h:`<div class="cd" data-pl="${p.id}"><div class="art pl">${ic('queue',44)}</div><div class="t1">${E(p.name)}</div><div class="t2">${ok.length} треков</div></div>`}};
const plr=p=>{const ok=plc(p).ok;return`<div class="row" data-pl="${p.id}">${art(ok[0])}<div class="tx"><div class="t1">${E(p.name)}</div><div class="t2">${ok.length} песен</div></div>›</div>`};
function home(){const A0=lib();VL=A0;if(!A0.length)return emp();
const pop=[...A0].sort((a,b)=>(PLY[b.id]||0)-(PLY[a.id]||0)||hs(a.id)-hs(b.id)),rnd=byH(A0),nw=[...A0].sort((a,b)=>(b.added||0)-(a.added||0)),al={};
A0.forEach(t=>{const k=t.album||t.id;(al[k]=al[k]||[]).push(t)});
return sec('Лучшее для вас',`<div class="hs">${pop.slice(0,6).map(big).join('')}</div>`)
+sec('Альбомы и синглы',`<div class="hs">${Object.values(al).slice(0,12).map(a=>cd(a[0],(a.length>1?'Альбом':'Сингл')+' • '+a[0].artist)).join('')}</div>`)
+sec('Быстрый доступ',`<div class="hs"><div class="md" style="background:#22b341" data-m="shuf">${ic('shuf',40)}<b>Вперемешку</b></div><div class="md" style="background:#2a9df4" data-m="fav">${ic('star',40)}<b>Избранное</b></div><div class="md" style="background:#6a45d9" data-m="all">${ic('note',40)}<b>Вся музыка</b></div></div>`)
+sec('Быстрый выбор',rnd.slice(0,4).map(rowH).join(''))
+sec('Новинки',`<div class="hs">${nw.slice(0,10).map(t=>cd(t)).join('')}</div>`)
+sec('В тренде',pop.slice(0,6).map(rowH).join(''))
+sec('Плейлисты для вас',PL.length?`<div class="hs">${PL.map(p=>plc(p).h).join('')}</div>`:'')}
function libp(){const A0=lib(),tp=Object.values(PLY).reduce((a,x)=>a+x,0),m={};A0.forEach(t=>{m[t.artist]=(m[t.artist]||0)+(PLY[t.id]||0)});const ta=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
return `<h1>Медиатека</h1><div class="hs"><div class="st" style="background:linear-gradient(135deg,#3b2a5a,#a5532c)"><small>ТВОЁ ПРОСЛУШИВАНИЕ</small><b>${Math.round(SEC/60)}</b><small>МИНУТ ПРОСЛУШАНО</small><em>${tp} прослушиваний</em></div>${ta&&ta[1]?`<div class="st" style="background:linear-gradient(135deg,#1f3b66,#6a45d9)"><small>ЛУЧШЕЕ</small><b class="sm">${E(ta[0])}</b><small>ТОП ИСПОЛНИТЕЛЬ</small></div>`:''}</div>
<div class="lr" data-c="local">${ic('folder',22)}<span>Локальная музыка</span>›</div><div class="lr" data-c="fav">${ic('star',22)}<span>Избранное</span>›</div>
<h3>Плейлисты</h3><div class="hs"><div class="cd" data-new="1"><div class="art pl">${ic('plus',44)}</div><div class="t1">Новый плейлист</div><div class="t2">Сохранится на устройстве</div></div>${PL.map(p=>plc(p).h).join('')}</div>`}
function expl(){const m={};lib().forEach(t=>{m[t.artist]=(m[t.artist]||0)+1});const pal=['#d9a441','#58b368','#8a8a8a','#8a5cd6','#c24848','#d9622b','#2f6fd6','#c4458f','#3a9bb5'],a=Object.entries(m).sort((x,y)=>y[1]-x[1]);
return '<h1>Обзор</h1>'+(a.length?`<div class="gr">${a.map(([n,c])=>`<div class="gn" data-ar="${E(n)}" style="--g:${pal[Math.abs(hs(n))%pal.length]}"><b>${E(n)}</b><small>${c} песен</small></div>`).join('')}</div>`:emp())}
function srchp(){return `<h1>Поиск</h1><input id="q" type="search" placeholder="Песни, исполнители, альбомы" value="${E(srch)}"><div id="sr"></div>`}
function sres(){const s=srch.trim().toLowerCase(),R=s?lib().filter(t=>(t.title+' '+t.artist+' '+(t.album||'')).toLowerCase().includes(s)):[];VL=R;$('#sr').innerHTML=R.length?R.map(rowH).join(''):`<div class="empty"><b>${s?'Ничего не найдено':'Поиск по медиатеке'}</b></div>`}
function colls(){const A0=lib();
if(C.k=='local')return{name:'Локальная музыка',sub:'Аудиофайлы на устройстве',tr:A0};
if(C.k=='fav')return{name:'Избранное',sub:'Плейлист',tr:A0.filter(t=>t.fav)};
if(C.k=='pl'){const p=PL.find(x=>x.id==C.id)||{ids:[],name:''};return{name:p.name,sub:'Плейлист',tr:p.ids.map(i=>T.find(t=>t.id==i)).filter(Boolean)}}
if(C.k=='alb')return{name:C.id||'Без альбома',sub:'Альбом',tr:A0.filter(t=>(t.album||'')==C.id)};
return{name:C.id,sub:'Исполнитель',tr:A0.filter(t=>t.artist==C.id)}}
function grp(k,tr){const m={};tr.forEach(t=>{const n=k=='art'?t.artist:(t.album||'');(m[n]=m[n]||[]).push(t)});
return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(([n,a])=>`<div class="row" data-${k=='art'?'ar':'al'}="${E(n)}">${art(a[0])}<div class="tx"><div class="t1">${E(n||'Без альбома')}</div><div class="t2">${a.length} песен</div></div>›</div>`).join('')}
function collp(){const c=colls(),tr=c.tr,tot=tr.reduce((a,t)=>a+(t.dur||0),0);VL=tr;
const hd=`<div class="cv">${tr[0]&&tr[0].au?`<img src="${tr[0].au}" alt="">`:ic(C.k=='local'?'folder':'queue',72)}</div><h2>${E(c.name)}</h2><div class="t2 ctr">${c.sub} · ${tr.length} треков${tot?' · '+hm(tot):''}</div><div class="pp"><button class="wb" data-a="play">${ic('play',20)}Играть</button><button class="db" data-a="shuf">${ic('shuf',20)}Вперемешку</button></div>`;
if(C.k!='local')return hd+(tr.length?tr.map(rowH).join(''):'<div class="empty"><b>Пусто</b></div>');
const tb=`<div class="seg">${[['songs','Песни'],['art','Исполнители'],['alb','Альбомы'],['pls','Плейлисты']].map(x=>`<button data-t="${x[0]}" class="${tab==x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
return hd+tb+(tab=='songs'?tr.map(rowH).join(''):tab=='pls'?(PL.map(plr).join('')||'<div class="empty">Нет плейлистов</div>'):grp(tab,tr))}
function go(v,c){if(v=='coll')H.push({v:view,c:C,t:tab});else H=[];view=v;C=c||null;tab='songs';fresh=true;draw();scrollTo(0,0)}
function back(){const p=H.pop();if(p){view=p.v;C=p.c;tab=p.t}else{view='home';C=null}fresh=true;draw();scrollTo(0,0)}
function draw(){const R=$('#app');
$('#tb').innerHTML=view=='coll'?`<button class="gc" data-a="bk">${ic('back',22)}</button><div class="gp"><button data-a="tsr">${ic('search',20)}</button><button data-a="tmo"><span class="dots">•••</span></button></div>`:`<span></span><button class="gc" data-a="add">${ic('plus',22)}</button>`;
document.querySelectorAll('#navp button').forEach(b=>b.classList.toggle('on',b.dataset.v==(view=='coll'?'lib':view)));
if(view=='search'&&!fresh&&$('#q')){sres();return}
const fr=fresh;fresh=false;R.className=fr?'in':'';R.innerHTML=view=='coll'?collp():view=='lib'?libp():view=='exp'?expl():view=='search'?srchp():home();if(view=='search')sres()}
const mark=()=>document.querySelectorAll('#app .row').forEach(r=>r.classList.toggle('on',!!r.dataset.id&&r.dataset.id===cur()?.id));
function count(){const t=cur();if(!t)return;PLY[t.id]=(PLY[t.id]||0)+1;try{localStorage.setItem('ply',JSON.stringify(PLY))}catch(e){}}
function tick(){const d=A.currentTime-pt;pt=A.currentTime;if(d>0&&d<1.5&&!A.paused){SEC+=d;if(++tk%40==0)try{localStorage.setItem('sec',SEC)}catch(e){}}}
function tmenu(id){const t=T.find(x=>x.id===id);if(!t)return;modal(`<div class="mh">${E(t.title)}</div><button class="mi" data-k="fav">${t.fav?'Убрать из избранного':'В избранное'}</button><button class="mi" data-k="pl">Добавить в плейлист</button><button class="mi" data-k="next">Играть следующей</button><button class="mi" data-k="queue">В конец очереди</button>${view=='coll'&&C.k=='pl'?'<button class="mi" data-k="rm">Убрать из плейлиста</button>':''}<button class="mi" data-k="del">Удалить из плеера</button>`);
$('#mc').onclick=e=>{const k=(e.target.closest('[data-k]')||{dataset:{}}).dataset.k;if(!k)return;
if(k=='fav'){t.fav=!t.fav;put(t);closeM();ui(true);draw()}else if(k=='pl'){closeM();pick(id)}else if(k=='next'){qi<0?start([t]):Q.splice(qi+1,0,id);closeM()}else if(k=='queue'){qi<0?start([t]):Q.push(id);closeM()}else if(k=='rm'){const p=PL.find(x=>x.id==C.id);p.ids=p.ids.filter(x=>x!=id);putP(p);closeM();draw()}else if(k=='del'){closeM();del(id)}}}
function onTap(e){const g=s=>e.target.closest(s);let x;
if(x=g('[data-a]')){const a=x.dataset.a;if(a=='bk')return back();if(a=='tsr')return go('search');if(a=='add')return importMenu();if(a=='play')return start(VL);if(a=='shuf')return start(VL,null,true);
if(a=='tmo'){if(C.k=='pl'){modal('<div class="mh">Плейлист</div><button class="mi" data-d="1">Удалить плейлист</button>');$('#mc').onclick=ev=>{if(ev.target.closest('[data-d]')){PL=PL.filter(y=>y.id!=C.id);tx('readwrite',s=>s.delete(C.id));closeM();back()}}}else importMenu();return}}
if(x=g('.more'))return tmenu(x.dataset.id);
if(x=g('[data-t]')){tab=x.dataset.t;return draw()}
if(x=g('.md')){const m=x.dataset.m;return m=='shuf'?start(lib(),null,true):go('coll',{k:m=='fav'?'fav':'local'})}
if(x=g('[data-pl]'))return go('coll',{k:'pl',id:x.dataset.pl});
if(g('[data-new]'))return pick(null);
if(x=g('[data-ar]'))return go('coll',{k:'art',id:x.dataset.ar});
if(x=g('.row[data-al]'))return go('coll',{k:'alb',id:x.dataset.al});
if(x=g('.cd[data-al],.bg[data-al]')){const a=x.dataset.al;return a?go('coll',{k:'alb',id:a}):start(VL,x.dataset.id)}
if(x=g('[data-c]'))return go('coll',{k:x.dataset.c});
if(x=g('[data-id]'))start(VL,x.dataset.id,sh)}
function start(list,id,shuf){if(!list.length)return;Q0=list.map(t=>t.id);sh=!!shuf;Q=[...Q0];if(sh)mix(id);qi=id?Q.indexOf(id):0;load()}
function mix(id){const c=id||Q[0],r=Q0.filter(x=>x!==c);for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]]}Q=[c,...r];qi=0}
function load(){const t=cur();if(!t)return;if(url)URL.revokeObjectURL(url);url=t.uri?null:URL.createObjectURL(t.blob);A.src=t.uri?Capacitor.convertFileSrc(t.uri):url;A.play().catch(()=>{});ui();mark();count()}
function next(auto){if(qi<Q.length-1)qi++;else if(rp==1||!auto)qi=0;else{A.pause();A.currentTime=0;return ui()}load()}
function prev(){if(A.currentTime>3)A.currentTime=0;else{qi=Math.max(0,qi-1);load()}}
const toggle=()=>{if(!cur())return;A.paused?A.play():A.pause()};
A.onended=()=>rp==2?(A.currentTime=0,A.play()):next(true);
A.onplay=A.onpause=()=>ui(true);
A.onloadedmetadata=()=>{const t=cur();if(t&&!t.dur){t.dur=A.duration;put(t)}};
A.ontimeupdate=()=>{tick();if(drag)return;const d=A.duration||0;$('#seek').value=d?A.currentTime/d*1000:0;sp($('#seek'));$('#tc').textContent=fm(A.currentTime);$('#td').textContent='-'+fm(d-A.currentTime)};
const sp=e=>e.style.setProperty('--p',(e.value-e.min)/(e.max-e.min)*100+'%');

function col(t){return new Promise(r=>{if(t.col)return r(t.col);if(!t.au)return r('#5b5f73');const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.drawImage(i,0,0,1,1);const d=x.getImageData(0,0,1,1).data;t.col=`rgb(${d[0]*.8|0},${d[1]*.8|0},${d[2]*.8|0})`;r(t.col)};i.onerror=()=>r('#5b5f73');i.src=t.au})}
function hero(t){col(t).then(c=>{$('#sheet').style.setProperty('--c',c);document.documentElement.style.setProperty('--amb',c);$('#hero').style.backgroundImage=t.au?`url("${t.au}")`:`linear-gradient(160deg,${c},#222)`;$('#bgb').style.backgroundImage=t.au?`url("${t.au}")`:`linear-gradient(160deg,${c},#222)`})}
function stage(){const t=cur();if(!t)return;const S=$('#stage');
if(showQ){const r=(id,i)=>{const x=T.find(y=>y.id===id);return x?`<div class="row${i==qi?' on':''}" data-i="${i}">${art(x)}<div class="tx"><div class="t1">${E(x.title)}</div><div class="t2">${E(x.artist)}</div></div>${i==qi?'':`<button class="qx" data-i="${i}">✕</button>`}</div>`:''};
S.innerHTML='<div class="qt">Очередь</div><div class="ql">Сейчас играет</div>'+r(Q[qi],qi)+'<div class="ql">Далее: из локальной музыки</div>'+Q.map((id,i)=>i>qi?r(id,i):'').join('')}
else if(showL)S.innerHTML='<div class="lyrmsg">Нет текста для этой песни</div>';else S.innerHTML=''}
let lastId=null;
function ui(soft){const t=cur(),pl=!A.paused;document.body.classList.toggle('pl',pl);$('#mini').hidden=!t;$('#mpp').innerHTML=ic(pl?'pause':'play',26);if(!t)return;
$('#ma').outerHTML=art(t).replace('class="art ','id="ma" class="art ');$('#mt').textContent=t.title;$('#mr').textContent=t.artist;
$('#pp').innerHTML=ic(pl?'pause':'play',60);$('#st').textContent=t.title;$('#sa').textContent=t.artist;$('#sf').innerHTML=ic('star',20,t.fav);$('#sheet').classList.toggle('q',showQ||showL);$('#sheet').classList.toggle('qm',showQ);$('#lyr').className=showL?'act':'';$('#mq').innerHTML=t.au?`<img src="${t.au}" alt="">`:ic('note',20);
$('#shuf').className=sh?'act':'';$('#rep').className=rp?'act':'';$('#rep').innerHTML=ic('rep',22)+(rp==2?'<i>1</i>':'');$('#qb').className=showQ?'act':'';
if(lastId!==t.id||!soft){stage();hero(t)}
if(lastId!==t.id){lastId=t.id;media(t)}if('mediaSession' in navigator)navigator.mediaSession.playbackState=pl?'playing':'paused';island()}
function media(t){if(!('mediaSession' in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:t.au?[{src:t.au,sizes:'512x512',type:t.art.type}]:[]})}catch(e){}}
if('mediaSession' in navigator){const m=navigator.mediaSession;[['play',()=>A.play()],['pause',()=>A.pause()],['previoustrack',prev],['nexttrack',()=>next()],['seekto',e=>A.currentTime=e.seekTime]].forEach(([a,f])=>{try{m.setActionHandler(a,f)}catch(e){}})}

/* --- события --- */

$('#n1').innerHTML=ic('home',24)+'<span>Главная</span>';$('#n2').innerHTML=ic('grid',24)+'<span>Обзор</span>';$('#n3').innerHTML=ic('lib',24)+'<span>Медиатека</span>';$('#srch').innerHTML=ic('search',24);
$('#qb').innerHTML=ic('queue',22);$('#shuf').innerHTML=ic('shuf',22);$('#pv').innerHTML=ic('rw',46);$('#nx').innerHTML=ic('ff',46);$('#lyr').innerHTML=ic('lyr',22);$('#out').innerHTML=ic('cast',22);$('#mo').innerHTML=ic('more',20);$('#mnx').innerHTML=ic('next',26);$('#v0').innerHTML=ic('vol',14);$('#v1').innerHTML=ic('vol',20);

$('#file').onchange=e=>{add([...e.target.files]);e.target.value=''};




function del(id){const t=T.find(x=>x.id===id);if(t&&t.uri)try{localStorage.setItem('hid',JSON.stringify([...hid(),t.uri]))}catch(e){}if(cur()?.id===id){A.pause();Q=[];Q0=[];qi=-1;lastId=null;$('#mini').hidden=true;$('#sheet').classList.remove('open');island()}Q=Q.filter(x=>x!==id);Q0=Q0.filter(x=>x!==id);if(t&&t.au)URL.revokeObjectURL(t.au);T=T.filter(x=>x.id!==id);tx('readwrite',s=>s.delete(id));PL.forEach(p=>{if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);putP(p)}});delId=null;draw()}
/* --- плейлисты, папка с автозагрузкой --- */
const AUD=/\.(mp3|m4a|flac|wav|ogg|aac|opus)$/i,putP=p=>tx('readwrite',s=>s.put(p)),closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};
$('#dir').onchange=e=>{add([...e.target.files]);e.target.value=''};
function modal(h){$('#mc').innerHTML=h;$('#md').hidden=false}




function pick(id){modal(`<div class="mh">${id?'В плейлист':'Новый плейлист'}</div>`+(id?PL.map(p=>`<button class="mi" data-p="${p.id}">${E(p.name)}<span>${p.ids.length}</span></button>`).join(''):'')+`<input id="pn" placeholder="Название нового плейлиста"><button class="mi ac" id="pc">Создать</button>`);
$('#mc').onclick=e=>{const b=e.target.closest('[data-p]');if(b){const p=PL.find(x=>x.id==b.dataset.p);if(!p.ids.includes(id))p.ids.push(id);putP(p);closeM();draw()}};
$('#pc').onclick=()=>{const n=$('#pn').value.trim();if(!n)return;const p={id:'pl-'+Date.now(),pl:true,name:n,ids:id?[id]:[]};PL.push(p);putP(p);closeM();draw()}}
function importMenu(){modal(`<div class="mh">Добавить музыку</div><button class="mi" id="i1">Выбрать файлы</button><button class="mi" id="i2">${NP()?'Сканировать музыку на устройстве':'Выбрать папку'+(window.showDirectoryPicker?' (автозагрузка)':'')}</button>${DIR?`<button class="mi" id="i3">Обновить из папки «${E(DIR.name)}»</button>`:''}`);
$('#i1').onclick=()=>{closeM();$('#file').click()};$('#i2').onclick=()=>{closeM();folder()};if(DIR)$('#i3').onclick=()=>{closeM();scan(true)}}
async function folder(){if(NP())return nscan(true);if(window.showDirectoryPicker){try{DIR=await showDirectoryPicker({mode:'read'});tx('readwrite',s=>s.put({id:'dir',handle:DIR}));scan(true)}catch(e){}}else $('#dir').click()}
async function* walk(h){for await(const [n,x] of h.entries()){if(x.kind=='file'){if(AUD.test(n))yield x}else yield* walk(x)}}
async function scan(ask){if(NP())return nscan(ask);if(!DIR)return;try{let p=await DIR.queryPermission({mode:'read'});if(p!='granted'){if(!ask)return;p=await DIR.requestPermission({mode:'read'})}if(p!='granted')return;const have=new Set(T.map(t=>t.src)),fs=[];for await(const h of walk(DIR)){const f=await h.getFile();if(!have.has(f.name+'|'+f.size))fs.push(f)}if(fs.length)await add(fs)}catch(e){}}
/* --- Android (Capacitor): автозагрузка всей музыки из MediaStore --- */
const NP=()=>{try{return window.Capacitor&&Capacitor.isNativePlatform()&&Capacitor.Plugins.MediaLibrary}catch(e){return 0}};
const hid=()=>{try{return JSON.parse(localStorage.getItem('hid')||'[]')}catch(e){return []}};
/* --- Xiaomi Hyper Island (Суперостров) и уведомление с управлением --- */
let isl='',thc={},showL=false,sleepT=null;
function thumb(t){return new Promise(r=>{if(!t.au)return r('');if(thc[t.id]!=null)return r(thc[t.id]);const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;c.getContext('2d').drawImage(i,0,0,192,192);thc[t.id]=c.toDataURL('image/jpeg',.8).split(',')[1];r(thc[t.id])};i.onerror=()=>r('');i.src=t.au})}
async function island(){const M=NP();if(!M)return;const t=cur();if(!t){isl='';M.island({cancel:true}).catch(()=>{});return}
const pl=!A.paused,k=t.id+pl;if(isl===k)return;isl=k;try{await M.island({title:t.title,artist:t.artist,playing:pl,art:await thumb(t)})}catch(e){}}
if(NP())try{NP().addListener('mediaAction',e=>{if(e.a=='toggle')toggle();else if(e.a=='next')next();else if(e.a=='prev')prev()})}catch(e){}

function menu(){const t=cur();if(!t)return;modal(`<div class="mh">${E(t.title)}</div><button class="mi" data-m="like">${t.fav?'Убрать из избранного':'Нравится'}</button><button class="mi" data-m="pl">Добавить в плейлист</button><button class="mi" data-m="next">Играть следующей</button><button class="mi" data-m="queue">Добавить в очередь</button><button class="mi" data-m="info">О песне</button><button class="mi" data-m="sleep">Таймер сна${sleepT?' · вкл':''}</button>`);
$('#mc').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
if(m=='like'){t.fav=!t.fav;put(t);ui(true);draw();closeM()}
else if(m=='pl'){closeM();pick(t.id)}
else if(m=='next'){Q.splice(qi+1,0,t.id);closeM();if(showQ)stage()}
else if(m=='queue'){Q.push(t.id);closeM();if(showQ)stage()}
else if(m=='info')modal(`<div class="mh">О песне</div><div class="mi">Название<span>${E(t.title)}</span></div><div class="mi">Исполнитель<span>${E(t.artist)}</span></div><div class="mi">Альбом<span>${E(t.album||'—')}</span></div><div class="mi">Длительность<span>${fm(t.dur)}</span></div>`);
else if(m=='sleep')sleepMenu()}}
function sleepMenu(){modal('<div class="mh">Таймер сна</div>'+[15,30,60].map(m=>`<button class="mi" data-s="${m}">${m} минут</button>`).join('')+'<button class="mi" data-s="0">Выключить</button>');
$('#mc').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;clearTimeout(sleepT);sleepT=null;const m=+b.dataset.s;if(m)sleepT=setTimeout(()=>{A.pause();sleepT=null},m*60000);closeM()}}
let scanning=false;
async function nscan(ask){if(scanning)return;scanning=true;try{const M=NP();let first=false;try{first=!localStorage.getItem('na');localStorage.setItem('na',1)}catch(e){}
const r=await M.list({ask:!!ask||first});if(r.denied)return;const items=r.items,keep=new Set(items.map(x=>x.uri));
const gone=T.filter(t=>t.uri&&!keep.has(t.uri));gone.forEach(t=>{tx('readwrite',s=>s.delete(t.id));if(t.au)URL.revokeObjectURL(t.au)});
if(gone.length){T=T.filter(t=>!gone.includes(t));PL.forEach(p=>{p.ids=p.ids.filter(i=>T.some(t=>t.id==i));putP(p)})}
const have=new Set(T.map(t=>t.uri)),hd=new Set(hid());
for(const x of items){if(have.has(x.uri)||hd.has(x.uri))continue;
const t={added:+x.id,id:'n'+x.id,uri:x.uri,src:x.name+'|'+x.size,title:x.title||x.name.replace(/\.[^.]+$/,''),artist:!x.artist||x.artist=='<unknown>'?'Неизвестный исполнитель':x.artist,album:x.album&&x.album!='<unknown>'?x.album:'',dur:x.dur,fav:false,art:null};
try{const a=await M.art({uri:x.uri});if(a.data){t.art=await (await fetch('data:image/jpeg;base64,'+a.data)).blob();t.au=URL.createObjectURL(t.art)}}catch(e){}
T.push(t);put(t);if(T.length%15==0)draw()}
}catch(e){}finally{scanning=false;draw()}}
$('#mini').onclick=e=>{if(!e.target.closest('button'))$('#sheet').classList.add('open')};
$('#mpp').onclick=toggle;$('#mnx').onclick=()=>next();$('#pp').onclick=toggle;$('#nx').onclick=()=>next();$('#pv').onclick=prev;
$('#cl').onclick=()=>$('#sheet').classList.remove('open');
$('#qb').onclick=()=>{showQ=!showQ;showL=false;ui()};$('#lyr').onclick=()=>{showL=!showL;showQ=false;ui()};$('#out').onclick=()=>modal('<div class="mh">Аудиовыход</div><div class="mi">Этот телефон<span>✓</span></div>');$('#mo').onclick=menu;
$('#stage').onclick=e=>{const x=e.target.closest('.qx');if(x){const k=+x.dataset.i;Q.splice(k,1);if(k<qi)qi--;return stage()}const r=e.target.closest('.row');if(r){qi=+r.dataset.i;load()}};
$('#sf').onclick=()=>{const t=cur();if(!t)return;t.fav=!t.fav;put(t);ui(true);draw()};
$('#shuf').onclick=()=>{const c=cur();if(!c)return;sh=!sh;if(sh)mix(c.id);else{Q=[...Q0];qi=Q.indexOf(c.id)}ui()};
$('#rep').onclick=()=>{rp=(rp+1)%3;ui(true)};
const sk=$('#seek');sk.oninput=()=>{drag=true;sp(sk);const d=A.duration||0;$('#tc').textContent=fm(sk.value/1000*d)};
sk.onchange=()=>{A.currentTime=sk.value/1000*(A.duration||0);drag=false};
$('#vol').oninput=e=>{A.volume=e.target.value;sp(e.target)};sp($('#vol'));sp(sk);
document.onkeydown=e=>{if(e.target.tagName=='INPUT'&&e.target.type!='range')return;if(e.code=='Space'){e.preventDefault();toggle()}else if(e.code=='ArrowRight'&&e.shiftKey)next();else if(e.code=='ArrowLeft'&&e.shiftKey)prev()};
let dc=0;addEventListener('dragenter',e=>{e.preventDefault();if(!dc++){const d=document.createElement('div');d.id='drop';d.textContent='Отпустите, чтобы добавить музыку';document.body.append(d)}});
addEventListener('dragleave',()=>{if(!--dc)$('#drop')?.remove()});addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop')?.remove();add([...e.dataTransfer.files])});

tx('readonly',s=>s.getAll()).then(r=>{r=r||[];PL=r.filter(x=>x.pl);DIR=(r.find(x=>x.id=='dir')||{}).handle||null;T=r.filter(x=>!x.pl&&x.id!='dir').map(t=>(t.art&&(t.au=URL.createObjectURL(t.art)),t));draw();scan(false)});
$('#app').onclick=onTap;$('#tb').onclick=onTap;
document.querySelectorAll('#navp button,#srch').forEach(b=>b.onclick=()=>go(b.dataset.v));
addEventListener('input',e=>{if(e.target.id=='q'){srch=e.target.value;sres()}});
let ly=0;addEventListener('scroll',()=>{const y=scrollY;if(y>ly+6&&y>60)$('#dock').classList.add('cl');else if(y<ly-6||y<30)$('#dock').classList.remove('cl');ly=y},{passive:true});
draw();
</script></body></html>
